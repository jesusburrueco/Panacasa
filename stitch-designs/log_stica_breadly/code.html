<style>
    body {
      background-color: #fefccf; /* background from config */
      color: #1d1d03; /* on-background from config */
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .texture-peek {
      clip-path: circle(50% at 50% 50%);
      transition: transform 0.3s ease;
    }
    .floating-van {
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .stagger-in {
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

<body class="antialiased overflow-hidden font-body-md text-body-md">

<main class="relative h-screen w-full flex flex-col items-center justify-between py-12 px-container-margin-mobile md:px-container-margin-desktop bg-surface dark:bg-surface-dim">

      </h1>
</header>
<!-- Content Canvas: Bento-like Layout for Mobile-First Onboarding -->
<div class="flex-1 w-full max-w-md mx-auto flex flex-col items-center justify-center">
<!-- Visual Illustration Area -->
<div class="relative w-full aspect-square mb-12 flex items-center justify-center">
<!-- Abstract Background Shape -->
<div class="absolute inset-0 bg-surface-container-low rounded-xl rotate-3 scale-95 opacity-50"></div>
<div class="absolute inset-0 bg-surface-container-high rounded-xl -rotate-3 scale-95 opacity-50 shadow-[0_4px_20px_rgba(139,69,19,0.06)]"></div>
<div class="relative z-10 w-full h-full flex items-center justify-center p-8">
<div class="grid grid-cols-2 gap-6 w-full">

<div class="w-24 h-24 rounded-full bg-primary-fixed flex items-center justify-center floating-van shadow-md">

</div>

</div>
<span class="font-label-md text-label-md text-on-surface-variant">Envío</span>
</div>
</div>

</div>

</main>
<!-- Interactive Atmosphere -->
<script>
    // Simple micro-interaction for the icons on tap/click
    document.querySelectorAll('.rounded-full').forEach(el => {
      el.addEventListener('mousedown', () => {
        el.style.transform = 'scale(0.92)';
      });
      el.addEventListener('mouseup', () => {
        el.style.transform = 'scale(1)';
      });
    });

    // Parallax-ish effect on the visual area
    document.addEventListener('mousemove', (e) => {
      const visualArea = document.querySelector('.relative.z-10');
      const xAxis = (window.innerWidth / 2 - e.pageX) / 40;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 40;
      if (visualArea) {
        visualArea.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
      }
    });
  </script>
