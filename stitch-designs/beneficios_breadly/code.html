      Siguiente
      <span class="material-symbols-outlined">arrow_forward</span>
</button>
</footer>
<script>
    // Micro-interaction for the central toggle
    document.addEventListener('DOMContentLoaded', () => {
      const toggleItems = document.querySelectorAll('.animate-float');
      
      // Add a subtle parallax effect on mouse move or device tilt
      window.addEventListener('mousemove', (e) => {
        const mouseX = e.clientX / window.innerWidth - 0.5;
        const mouseY = e.clientY / window.innerHeight - 0.5;
        
        toggleItems.forEach((item, index) => {
          const depth = (index + 1) * 10;
          item.style.transform = `translate(${mouseX * depth}px, ${mouseY * depth}px)`;
        });
      });
    });
  </script>
